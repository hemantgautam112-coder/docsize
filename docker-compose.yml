# Production stack: Caddy (web + HTTPS), the FastAPI backend, and PostgreSQL.
# Only ports 80 and 443 are published. The database and API are reachable only inside the Docker network.
#
# Start:  docker compose up -d --build
# Logs:   docker compose logs -f api

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docsize}
      POSTGRES_USER: ${POSTGRES_USER:-docsize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docsize} -d ${POSTGRES_DB:-docsize}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      # Set these in .env. Production: APP_ENV=production, COOKIE_SECURE=true, FRONTEND_ORIGIN=https://hdvault.in
      APP_ENV: ${APP_ENV:-production}
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-https://hdvault.in}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-docsize}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-docsize}
      STORAGE_DIR: /data/storage
    volumes:
      - docsize_files:/data/storage
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  docsize_files:
  caddy_data:
  caddy_config:
